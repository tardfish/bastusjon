name: Update water temperature

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-temperature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch temperature from Home Assistant
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.HA_URL }}/api/states/${{ secrets.ENTITY_ID }}" \
            > response.json

          echo "Home Assistant response:"
          cat response.json

          TEMP=$(jq -r '.state' response.json)
          UPDATED=$(jq -r '.last_updated' response.json)
          UNIT=$(jq -r '.attributes.unit_of_measurement' response.json)

          echo "{
            \"temperature\": $TEMP,
            \"unit\": \"$UNIT\",
            \"updated\": \"$UPDATED\"
          }" > temp.json

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add temp.json

          git commit -m "Update water temperature" || exit 0

          git push
