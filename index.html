<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bastusjön</title>

  <style>
    :root {
      --bg1: #dff7ff;
      --bg2: #7cc7df;
      --card: rgba(255, 255, 255, 0.82);
      --text: #073044;
      --muted: #4d6b78;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 55, 80, 0.18);
      backdrop-filter: blur(14px);
    }

    .logo {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    .label {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .temp {
      margin: 8px 0 4px;
      font-size: clamp(5rem, 24vw, 7rem);
      font-weight: 750;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .updated {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      color: #8a1f1f;
    }

    footer {
      margin-top: 18px;
      color: rgba(7, 48, 68, 0.65);
      font-size: 0.85rem;
    }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="dd50bd5d-c396-4abb-b846-f6e8d0334e10"></script>
</head>

<body>
  <main>
    <section class="card">
      <div class="logo">🌊</div>
      <h1>Bastusjön i Skuru<j/h1>

      <div class="label">Vattentemperatur</div>
      <div class="temp" id="temp">--°</div>

      <div class="updated" id="updated"></div>
      </section>
  </main>

  <script>
    function timeAgo(dateString) {
      const date = new Date(dateString);
      const minutes = Math.round((Date.now() - date.getTime()) / 60000);

      if (minutes < 1) return "nyss";
      if (minutes === 1) return "för 1 minut sedan";
      if (minutes < 60) return `för ${minutes} minuter sedan`;

      const hours = Math.round(minutes / 60);

      if (hours === 1) return "för 1 timme sedan";

      return `för ${hours} timmar sedan`;
    }

    async function loadTemperature() {
      try {
        const response =
          await fetch("temp.json?t=" + Date.now());

        const data = await response.json();

        const temp = Number(data.temperature);

        document.getElementById("temp").textContent =
          `${temp.toFixed(1)}°`;

        document.getElementById("updated").textContent =
          `Uppdaterad ${timeAgo(data.updated)}`;

      } catch (error) {
        document.getElementById("updated").textContent =
          "Kunde inte hämta temperatur";

        document.getElementById("updated").classList.add("error");
      }
    }

    loadTemperature();

    setInterval(loadTemperature, 30000);
  </script>
</body>
</html>
